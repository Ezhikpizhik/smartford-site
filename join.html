<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join the Smartford Family</title>
  <meta name="description" content="Sign up for early access, launch updates, and a thank-you discount from Smartford." />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --white:      #FFFFFF;
      --bg-cream:   #FEFCF8;
      --blue:       #3668C4;
      --navy:       #334155;
      --slate:      #475569;
      --r-red:    #E83222;
      --r-orange: #F5821E;
      --r-yellow: #F9D422;
      --r-green:  #3DAA6A;
      --r-teal:   #2ABAB4;
      --r-blue:   #3668C4;
      --r-purple: #7B52A8;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg-cream);
      color: var(--navy);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3 { font-family: 'Playfair Display', serif; line-height: 1.2; }

    /* ── RAINBOW BAR ── */
    .rainbow-bar {
      height: 5px;
      background: linear-gradient(90deg,
        var(--r-red), var(--r-orange), var(--r-yellow),
        var(--r-green), var(--r-teal), var(--r-blue), var(--r-purple));
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 2.2rem;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary {
      background: #2ABAB4;
      color: #ffffff !important;
      box-shadow: 0 8px 24px rgba(42,186,180,.25);
    }
    .btn-primary:hover { transform: translateY(-3px); }

    /* ── NAV ── */
    nav {
      background-color: rgba(235,248,247,0.97);
      background-image:
        radial-gradient(circle, rgba(42,186,180,0.13) 1.5px, transparent 1.5px),
        radial-gradient(circle, rgba(123,82,168,0.07) 1px, transparent 1px);
      background-size: 28px 28px, 14px 14px;
      background-position: 0 0, 7px 7px;
      backdrop-filter: blur(10px);
      height: 96px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(42,186,180,0.15);
    }
    .nav-inner {
      width: 100%; max-width: 1160px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center; padding: 0 6%;
    }
    .nav-logo img { height: 44px; width: auto; display: block; }
    .nav-links { display: flex; gap: 2.5rem; align-items: center; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--navy); font-weight: 700; font-size: 0.95rem; transition: color 0.2s; }
    .nav-links a:hover { color: var(--blue); }
    .nav-links .btn-primary:hover { background: var(--blue) !important; box-shadow: 0 8px 24px rgba(54,104,196,.35) !important; }
    .btn-sm { padding: 0.6rem 1.4rem; font-size: 0.88rem; }
    @media (max-width: 600px) {
      nav { height: auto; padding: 0.75rem 0; }
      .nav-inner { flex-direction: column; gap: 0.75rem; }
      .nav-links { flex-wrap: wrap; gap: 0.5rem 1.25rem; justify-content: center; }
    }

    /* ── MAIN CONTENT ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── SIGNUP CARD ── */
    .signup-card {
      background: var(--white);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(15,23,42,.09);
      padding: 3rem 2.5rem;
      max-width: 500px;
      width: 100%;
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .signup-card h1 {
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      color: var(--blue);
      margin-bottom: 0.75rem;
    }

    .signup-card .subtitle {
      color: var(--slate);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* ── EMAIL FORM ── */
    .email-form { width: 100%; }

    .input-row {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .email-form input[type="email"] {
      width: 100%;
      padding: 1rem 1.25rem;
      border: 2px solid #E2E8F0;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      color: var(--navy);
      outline: none;
      transition: border-color 0.2s;
    }
    .email-form input[type="email"]:focus {
      border-color: var(--r-teal);
    }
    .email-form input[type="email"]::placeholder { color: #94A3B8; }

    .btn-signup {
      width: 100%;
      padding: 1rem 1.5rem;
      background: var(--r-teal);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 8px 24px rgba(42,186,180,.3);
    }
    .btn-signup:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .form-note {
      margin-top: 0.75rem;
      color: #94A3B8;
      font-size: 0.85rem;
    }

    /* ── GEOGRAFIUM CARD ── */
    .geo-card {
      background: var(--white);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(15,23,42,.09);
      padding: 2.5rem 2.5rem;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    .geo-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--r-orange), var(--r-red));
      color: #fff;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 50px;
      margin-bottom: 1.25rem;
    }

    .geo-card img {
      width: 140px;
      height: auto;
      border-radius: 12px;
      margin-bottom: 1.25rem;
      box-shadow: 0 8px 24px rgba(15,23,42,.12);
    }

    .geo-card h2 {
      font-size: 1.6rem;
      color: var(--navy);
      margin-bottom: 0.6rem;
    }

    .geo-card p {
      color: var(--slate);
      font-size: 0.98rem;
      line-height: 1.65;
      margin-bottom: 1.5rem;
    }

    .btn-preorder {
      display: inline-block;
      padding: 0.9rem 2.2rem;
      background: linear-gradient(135deg, var(--r-orange), var(--r-red));
      color: #fff;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(245,130,30,.3);
      transition: all 0.25s;
    }
    .btn-preorder:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    /* ── FOOTER ── */
    .page-footer {
      text-align: center;
      padding: 1.5rem;
      color: #94A3B8;
      font-size: 0.85rem;
    }
    .page-footer a { color: var(--r-teal); text-decoration: none; }
    .page-footer a:hover { text-decoration: underline; }

/* ── SUCCESS STATE ── */
    .success-msg {
      display: none;
      background: #ECFDF5;
      border: 2px solid #6EE7B7;
      border-radius: 16px;
      padding: 1.25rem;
      color: #065F46;
      font-weight: 700;
      font-size: 1rem;
      margin-top: 1rem;
    }

    @media (max-width: 540px) {
      .signup-card, .geo-card { padding: 2rem 1.5rem; border-radius: 20px; }
    }
  </style>
</head>
<body>

<div class="rainbow-bar"></div>

<nav>
  <div class="nav-inner">
    <div class="nav-logo">
      <a href="https://www.smartford.org">
        <img src="smartford-logo.png" alt="Smartford" onerror="this.outerHTML='<span style=\'font-family:Playfair Display,serif;font-weight:900;font-size:1.5rem;color:#0F172A\'>Smartford</span>';" />
      </a>
    </div>
    <ul class="nav-links">
      <li><a href="https://www.smartford.org/games.html">Games</a></li>
      <li><a href="https://www.smartford.org/books.html">Books</a></li>
      <li><a href="https://www.smartford.org/shop.html" class="btn btn-primary btn-sm" style="white-space:nowrap;">Shop Now</a></li>
    </ul>
  </div>
</nav>

<main>

  <!-- EMAIL SIGNUP -->
  <div class="signup-card">
    <h1>Get early access & discounts</h1>
    <p style="color:#CBD5E1; font-size:0.82rem; margin-bottom:1.5rem;">No spam!</p>

    <form class="email-form" action="https://formspree.io/f/xwvwrrae" method="POST" id="signupForm">
      <div class="input-row">
        <input type="email" name="email" placeholder="Your email address" required />
        <button type="submit" class="btn-signup">Sign Me Up →</button>
      </div>
    </form>

    <div class="success-msg" id="successMsg">
      🎉 You're in! Watch your inbox for updates.
    </div>

  </div>


</main>

<div class="rainbow-bar"></div>

<footer class="page-footer">
  <p><a href="index.html">← Back to Smartford.org</a></p>
</footer>

<script>
  // Show success message on form submit (Formspree redirects by default,
  // but this handles the rare case of AJAX-style submission)
  const form = document.getElementById('signupForm');
  const successMsg = document.getElementById('successMsg');
  form.addEventListener('submit', function() {
    setTimeout(function() {
      successMsg.style.display = 'block';
    }, 500);
  });
</script>

</body>
</html>
